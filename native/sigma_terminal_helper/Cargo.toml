[package]
name = "sigma-terminal-helper"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
libc = "0.2.177"
portable-pty = "0.9.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sysinfo = { version = "0.37.2", default-features = false, features = ["system"] }
vt100 = "0.16.2"

[dev-dependencies]
wait-timeout = "0.2.1"
