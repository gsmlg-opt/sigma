name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  elixir:
    name: Elixir format and compile
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5"
          elixir-version: "1.18.4"

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Restore exact Elixir build cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            ~/.hex
            ~/.mix
            ~/.cache/rebar3
            ~/.cargo/registry
            ~/.cargo/git
            apps/sigma_tools/native/sigma_tools_hashline/target
          key: ci-elixir-${{ runner.os }}-${{ runner.arch }}-otp-28.5-elixir-1.18.4-${{ hashFiles('mix.lock', '**/mix.exs', '**/Cargo.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Check Elixir formatting
        run: mix format --check-formatted

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

  rust:
    name: Rust format, Clippy, and tests
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt --no-self-update
          rustup default stable

      - name: Restore exact Rust build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/sigma_tools/native/sigma_tools_hashline/target
          key: ci-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/sigma_tools/native/sigma_tools_hashline/Cargo.lock', 'apps/sigma_tools/native/sigma_tools_hashline/Cargo.toml') }}

      - name: Check Rust formatting
        run: cargo fmt --manifest-path apps/sigma_tools/native/sigma_tools_hashline/Cargo.toml -- --check

      - name: Lint Rust
        run: >-
          cargo clippy
          --manifest-path apps/sigma_tools/native/sigma_tools_hashline/Cargo.toml
          --all-targets --
          -D warnings
          -A clippy::collapsible-str-replace
          -A clippy::type-complexity

      - name: Run Rust tests
        run: cargo test --manifest-path apps/sigma_tools/native/sigma_tools_hashline/Cargo.toml

  assets:
    name: Web asset setup and build
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5"
          elixir-version: "1.18.4"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Restore exact asset build cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            node_modules
            ~/.hex
            ~/.mix
            ~/.cache/rebar3
          key: ci-assets-${{ runner.os }}-${{ runner.arch }}-otp-28.5-elixir-1.18.4-bun-1.3.13-${{ hashFiles('mix.lock', 'package-lock.json', '**/package.json') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Set up web assets
        run: mix assets.setup

      - name: Build web assets
        run: mix assets.build

      - name: Run asset-dependent ExUnit checks
        run: mix test --only assets apps/sigma_web/test/sigma_web/assets_build_test.exs

  release_smoke:
    name: Installed release agent smoke
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: prod

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5"
          elixir-version: "1.18.4"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Restore exact release smoke cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            node_modules
            ~/.hex
            ~/.mix
            ~/.cache/rebar3
            ~/.cargo/registry
            ~/.cargo/git
            apps/sigma_tools/native/sigma_tools_hashline/target
          key: ci-release-${{ runner.os }}-${{ runner.arch }}-otp-28.5-elixir-1.18.4-bun-1.3.13-${{ hashFiles('mix.lock', 'package-lock.json', '**/package.json', '**/Cargo.lock') }}

      - name: Install production dependencies
        run: |
          mix deps.get --only prod
          mix assets.setup

      - name: Build release
        run: mix sigma.rel-build

      - name: Exercise the installed agent and session seam
        env:
          PHX_SERVER: "false"
          RELEASE_NODE: sigma_ci_release_smoke
        run: |
          export SECRET_KEY_BASE="$(openssl rand -hex 64)"
          smoke_code="$(<scripts/verify-release-agent-smoke.exs)"
          _build/prod/sigma_rel/rel/sigma/bin/sigma eval "$smoke_code"
