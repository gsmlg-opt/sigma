name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g. 1.2.3)
        required: true
        type: string
      git_ref:
        description: Main branch containing the committed release version
        required: true
        default: main
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve release source
    runs-on: ubuntu-26.04
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0

      - name: Validate version and branch
        id: source
        env:
          GIT_REF: ${{ inputs.git_ref }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must be a semantic version without a leading v."
            exit 1
          fi

          branch="${GIT_REF#refs/heads/}"
          if [[ "$branch" != main ]]; then
            echo "::error::Releases must use main."
            exit 1
          fi

          remote_sha="$(git ls-remote --heads origin "refs/heads/${branch}" | awk 'NR == 1 { print $1 }')"
          if [[ -z "$remote_sha" ]]; then
            echo "::error::origin/main does not exist."
            exit 1
          fi

          source_sha="$(git rev-parse HEAD)"
          if [[ "$source_sha" != "$remote_sha" ]]; then
            echo "::error::Checked-out source does not match origin/${branch}."
            exit 1
          fi

          if git show-ref --verify --quiet "refs/tags/v${VERSION}"; then
            echo "::error::Tag v${VERSION} already exists."
            exit 1
          fi

          if ! grep -Fq "version: \"${VERSION}\"" mix.exs; then
            echo "::error::Commit version ${VERSION} on main before dispatching a release."
            exit 1
          fi

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify release source
    needs: resolve
    runs-on: ubuntu-26.04

    steps:
      - name: Check out resolved release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5"
          elixir-version: "1.18.4"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt --no-self-update
          rustup default stable

      - name: Restore exact verification cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            node_modules
            ~/.hex
            ~/.mix
            ~/.cache/rebar3
            ~/.cargo/registry
            ~/.cargo/git
            native/sigma_terminal_helper/target
          key: release-verify-ubuntu-26.04-${{ runner.arch }}-otp-28.5-elixir-1.18.4-bun-1.3.13-${{ hashFiles('mix.lock', 'package-lock.json', '**/package.json', '**/Cargo.lock') }}

      - name: Build debug native helpers before Mix commands
        run: scripts/build-terminal-helper.sh debug

      - name: Install dependencies
        run: |
          mix deps.get
          mix npm.install --frozen
          mix duskmoon.bundle

      - name: Check Elixir formatting
        run: mix format --check-formatted

      - name: Compile with warnings as errors
        run: mix compile --force --warnings-as-errors

      - name: Build MCP stdio guardian for plugin lifecycle checks
        run: mix backplane.mcp.stdio.build

      - name: Run terminal and release functional tests
        run: |
          mix test \
            apps/sigma_agent/test/sigma_agent/terminals/fake_backend_test.exs \
            apps/sigma_agent/test/sigma_agent/terminals/manager_test.exs \
            apps/sigma_agent/test/sigma_agent/terminals/native_stream_integration_test.exs \
            apps/sigma_agent/test/sigma_agent/terminals/replay_test.exs \
            apps/sigma_agent/test/sigma_agent/terminals/resource_ledger_test.exs \
            apps/sigma_agent/test/sigma_agent/terminals/supervision_test.exs \
            apps/sigma_web/test/sigma_web/session/terminal_binding_test.exs \
            apps/sigma_web/test/sigma_web/release_runtime_config_test.exs \
            apps/sigma_web/test/sigma_web/release_workflow_test.exs

      - name: Run browser terminal regression tests
        run: bun test apps/sigma_web/assets/js/hooks/session_terminals_test.js

      - name: Run native terminal functional tests
        run: |
          cargo test --locked --manifest-path native/sigma_terminal_helper/Cargo.toml --test native --test pty_output

      - name: Check terminal helper formatting
        run: cargo fmt --manifest-path native/sigma_terminal_helper/Cargo.toml -- --check

      - name: Lint terminal helper
        run: cargo clippy --locked --manifest-path native/sigma_terminal_helper/Cargo.toml --all-targets -- -D warnings

      - name: Build web assets
        run: mix assets.build

  build:
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    needs:
      - resolve
      - verify
    runs-on: ${{ matrix.runner }}
    env:
      MIX_ENV: prod
      VERSION: ${{ inputs.version }}
      SIGMA_GIT_REF: v${{ inputs.version }}
      SIGMA_GIT_SHA: ${{ needs.resolve.outputs.source_sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            os: linux
            arch: amd64
          - runner: ubuntu-26.04-arm
            os: linux
            arch: arm64
          - runner: macos-26-intel
            os: macos
            arch: amd64
          - runner: macos-26
            os: macos
            arch: arm64

    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5"
          elixir-version: "1.18.4"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Restore build caches
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            node_modules
            ~/.hex
            ~/.mix
            ~/.cache/rebar3
            ~/.cargo/registry
            ~/.cargo/git
            native/sigma_terminal_helper/target
          key: release-${{ matrix.runner }}-${{ matrix.arch }}-otp-28.5-elixir-1.18.4-${{ hashFiles('mix.lock', 'package-lock.json', '**/Cargo.lock', '**/package.json') }}

      - name: Prepare native helpers before Mix commands
        run: scripts/build-terminal-helper.sh release

      - name: Install production dependencies
        run: |
          mix deps.get --only prod
          mix npm.install --frozen
          mix duskmoon.bundle

      - name: Rebuild release applications
        run: |
          export SIGMA_RELEASE_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "SIGMA_RELEASE_TIME=${SIGMA_RELEASE_TIME}" >> "$GITHUB_ENV"
          mix compile --force

      - name: Build MCP stdio guardian
        run: mix backplane.mcp.stdio.build

      - name: Build production assets
        run: mix assets.deploy

      - name: Build release
        run: |
          rm -rf _build/prod/rel/sigma
          mix release sigma --overwrite
          for binary in sigma-terminal-helper sigma-sandbox-launcher sigma-setsid; do
            test -x "$(
              find _build/prod/rel/sigma/lib \
                -path "*/sigma_agent-*/priv/native/$binary" \
                -type f \
                -print \
                -quit
            )"
          done
          guardian="$(
            find _build/prod/rel/sigma/lib \
              -path '*/backplane_mcp_protocol-*/priv/bin/backplane-mcp-stdio-guardian' \
              -type f \
              -print \
              -quit
          )"
          test -x "$guardian"
          "$guardian" --probe

      - name: Add user service files
        run: |
          scripts/verify-release-services.sh
          install -d _build/prod/rel/sigma/service
          install -m 0644 \
            rel/service/com.gsmlg.sigma.plist \
            _build/prod/rel/sigma/service/com.gsmlg.sigma.plist
          install -m 0644 \
            rel/service/sigma.service \
            _build/prod/rel/sigma/service/sigma.service
          install -m 0755 \
            rel/service/sigma-user-service \
            _build/prod/rel/sigma/service/sigma-user-service
          install -m 0644 \
            rel/service/README.md \
            _build/prod/rel/sigma/service/README.md
          scripts/verify-release-services.sh _build/prod/rel/sigma/service

      - name: Package release
        env:
          ARCH: ${{ matrix.arch }}
          OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          mkdir -p dist
          archive="sigma-v${VERSION}-${OS}-${ARCH}.tar.gz"
          tar -czf "dist/${archive}" -C _build/prod/rel sigma
          tar -tzf "dist/${archive}" > "dist/${archive}.contents"

          for service_file in \
            sigma/service/com.gsmlg.sigma.plist \
            sigma/service/sigma.service \
            sigma/service/sigma-user-service \
            sigma/service/README.md; do
            grep -Fxq "$service_file" "dist/${archive}.contents"
          done
          for binary in sigma-terminal-helper sigma-sandbox-launcher sigma-setsid; do
            grep -Eq "^sigma/lib/sigma_agent-[^/]+/priv/native/${binary}$" "dist/${archive}.contents"
          done
          rm "dist/${archive}.contents"

          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "${archive}.sha256"
          else
            shasum -a 256 "$archive" > "${archive}.sha256"
          fi

      - name: Verify terminal helper from installed archive
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          native_smoke_root="$(mktemp -d "${RUNNER_TEMP:?}/sigma-native-install.XXXXXXXX")"
          trap 'rm -rf "$native_smoke_root"' EXIT
          tar -xzf "dist/sigma-v${VERSION}-linux-amd64.tar.gz" -C "$native_smoke_root"
          python3 - "$native_smoke_root/sigma" <<'PY'
          import base64
          import json
          from pathlib import Path
          import subprocess
          import sys

          helpers = list(Path(sys.argv[1]).glob("lib/sigma_agent-*/priv/native/sigma-terminal-helper"))
          assert len(helpers) == 1, "expected one packaged terminal helper"
          process = subprocess.Popen(
              [str(helpers[0]), "--", "/bin/sh", "-c",
               "stty -opost; printf 'release-terminal-smoke\\r\\n'; exit 17"],
              stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
          )
          # Keep the control channel open until natural exit drains PTY output.
          control = process.stdin
          process.stdin = None
          try:
              try:
                  output, error = process.communicate(timeout=20)
              except subprocess.TimeoutExpired:
                  control.write(b'{"op":"close"}\n')
                  control.flush()
                  try:
                      process.communicate(timeout=6)
                  except subprocess.TimeoutExpired:
                      process.kill()
                      process.communicate()
                  raise AssertionError("installed terminal helper timed out") from None
          finally:
              control.close()

          assert process.returncode == 0, error.decode(errors="replace")
          events = [json.loads(line) for line in output.splitlines()]
          assert events[0]["event"] == "started", events
          assert events[-2]["event"] == "shell_exit" and events[-2]["status"] == 17, events
          assert events[-1]["event"] == "cleanup" and events[-1]["result"]["complete"], events
          frames = events[1:-2]
          assert all(frame["event"] == "output" for frame in frames), frames
          assert [frame["seq"] for frame in frames] == list(range(1, len(frames) + 1)), frames
          assert b"".join(base64.b64decode(frame["data"], validate=True) for frame in frames) == b"release-terminal-smoke\r\n"
          print("installed terminal helper smoke ok")
          PY

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: sigma-release-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs:
      - resolve
      - build
    runs-on: ubuntu-26.04
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
      VERSION: ${{ inputs.version }}

    steps:
      - name: Check out verified release SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0

      - name: Verify release branch has not moved
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote --heads origin refs/heads/main | awk 'NR == 1 { print $1 }')"
          if [[ "$remote_sha" != "$SOURCE_SHA" ]]; then
            echo "::error::origin/main moved while release artifacts were building. Run the release again."
            exit 1
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: sigma-release-*
          path: dist
          merge-multiple: true

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          for target in linux-amd64 linux-arm64 macos-amd64 macos-arm64; do
            archive="sigma-v${VERSION}-${target}.tar.gz"
            test -s "dist/${archive}"
            test -s "dist/${archive}.sha256"
            (cd dist && sha256sum --check "${archive}.sha256")
          done

      - name: Smoke installed Linux release
        run: |
          set -euo pipefail

          archive="dist/sigma-v${VERSION}-linux-amd64.tar.gz"
          smoke_root="${RUNNER_TEMP}/sigma-release-smoke"
          smoke_home="${smoke_root}/home"
          smoke_port=14580
          smoke_log="${smoke_root}/sigma.log"

          rm -rf "$smoke_root"
          if [[ -n "$(ss -H -ltn "sport = :${smoke_port}")" ]]; then
            echo "::error::Smoke port ${smoke_port} is already in use."
            exit 1
          fi
          mkdir -p \
            "$smoke_home/.local/share" \
            "$smoke_home/.config/sigma"
          tar -xzf "$archive" -C "$smoke_home/.local/share"

          release_root="$smoke_home/.local/share/sigma"
          test "$("$release_root/bin/sigma" version)" = "sigma ${VERSION}"

          secret_key_base="$(openssl rand -hex 64)"
          expected_dependency_version="$(
            sed -nE 's/^  "backplane_mcp_protocol": \{:hex, :backplane_mcp_protocol, "([^"]+)".*/\1/p' mix.lock
          )"
          test -n "$expected_dependency_version"
          dependency_version="$(
            HOME="$smoke_home" \
            SECRET_KEY_BASE="$secret_key_base" \
            PHX_SERVER=false \
            RELEASE_NODE="sigma_release_eval_${GITHUB_RUN_ID}" \
            "$release_root/bin/sigma" eval \
              'IO.puts(Application.spec(:backplane_mcp_protocol, :vsn))'
          )"
          test "$dependency_version" = "$expected_dependency_version"

          smoke_code="$(<scripts/verify-release-agent-smoke.exs)"
          smoke_result="$(
            HOME="$smoke_home" \
            SECRET_KEY_BASE="$secret_key_base" \
            PHX_SERVER=false \
            RELEASE_NODE="sigma_release_agent_smoke_${GITHUB_RUN_ID}" \
            "$release_root/bin/sigma" eval "$smoke_code"
          )"
          test "$smoke_result" = "release agent smoke ok"

          printf 'SECRET_KEY_BASE=%s\nPHX_SERVER=true\nPORT=%s\nRELEASE_NODE=%s\n' \
            "$secret_key_base" \
            "$smoke_port" \
            "sigma_release_smoke_${GITHUB_RUN_ID}" \
            > "$smoke_home/.config/sigma/env"
          chmod 600 "$smoke_home/.config/sigma/env"

          HOME="$smoke_home" \
            "$release_root/service/sigma-user-service" \
            > "$smoke_log" 2>&1 &
          smoke_pid=$!

          cleanup() {
            if kill -0 "$smoke_pid" 2>/dev/null; then
              kill -TERM "$smoke_pid" 2>/dev/null || true
              for _cleanup_attempt in $(seq 1 20); do
                kill -0 "$smoke_pid" 2>/dev/null || break
                sleep 0.5
              done
            fi

            if kill -0 "$smoke_pid" 2>/dev/null; then
              kill -KILL "$smoke_pid" 2>/dev/null || true
            fi
            wait "$smoke_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for _attempt in $(seq 1 60); do
            http_code="$(
              curl --silent --show-error \
                --output /dev/null \
                --write-out '%{http_code}' \
                "http://127.0.0.1:${smoke_port}/" \
                2>/dev/null || true
            )"
            if [[ "$http_code" == 200 ]]; then
              ready=1
              break
            fi

            if ! kill -0 "$smoke_pid" 2>/dev/null; then
              cat "$smoke_log"
              exit 1
            fi
            sleep 1
          done

          if [[ "$ready" != 1 ]]; then
            cat "$smoke_log"
            exit 1
          fi

          python3 scripts/verify-release-web-smoke.py \
            "http://127.0.0.1:${smoke_port}/" "$VERSION" "$SOURCE_SHA"

          kill -TERM "$smoke_pid"
          for _attempt in $(seq 1 60); do
            kill -0 "$smoke_pid" 2>/dev/null || break
            sleep 0.5
          done

          if kill -0 "$smoke_pid" 2>/dev/null; then
            cat "$smoke_log"
            echo "::error::Installed Sigma release did not stop after SIGTERM."
            exit 1
          fi

          wait "$smoke_pid" || true
          trap - EXIT

          if [[ -n "$(ss -H -ltn "sport = :${smoke_port}")" ]]; then
            echo "::error::Installed Sigma release still listens after SIGTERM."
            exit 1
          fi

      - name: Prepare user service assets
        run: |
          scripts/verify-release-services.sh
          install -m 0644 rel/service/com.gsmlg.sigma.plist dist/com.gsmlg.sigma.plist
          install -m 0644 rel/service/sigma.service dist/sigma.service
          install -m 0644 rel/service/README.md dist/USER_SERVICE_INSTALL.md

      - name: Publish verified SHA and create tag
        run: |
          set -euo pipefail
          grep -Fq "version: \"${VERSION}\"" mix.exs
          remote_sha="$(git ls-remote --heads origin refs/heads/main | awk 'NR == 1 { print $1 }')"
          if [[ "$remote_sha" != "$SOURCE_SHA" ]]; then
            echo "::error::origin/main moved during installed-release checks. Run the release again."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Sigma v${VERSION}"
          git push origin "refs/tags/v${VERSION}:refs/tags/v${VERSION}"

      - name: Create GitHub Release
        run: |
          gh release create "v${VERSION}" dist/* \
            --verify-tag \
            --title "Sigma v${VERSION}" \
            --generate-notes
